name: Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyinstaller pywebview minecraft-launcher-lib certifi
      - name: Build app
        run: |
            python -m PyInstaller --windowed --name "Minecraft Launcher" --icon icon.icns \
            --add-data "index.html:." \
            --add-data "Logic:Logic" \
            --add-data "Styles:Styles" \
            --add-data "Panoramas:Panoramas" \
            --add-data "Minecraft_blocks:Minecraft_blocks" \
            --add-data "icon.png:." \
            main.py
      - name: Zip app
        run: cd dist && ditto -c -k --keepParent "Minecraft Launcher.app" "MinecraftLauncher-mac.zip"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MinecraftLauncher-mac.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyinstaller pywebview minecraft-launcher-lib certifi
      - name: Build exe
        run: |
          python -m PyInstaller --windowed --name "MinecraftLauncher" --icon icon.ico `
            --add-data "index.html;." `
            --add-data "Logic;Logic" `
            --add-data "Styles;Styles" `
            --add-data "Minecraft_blocks;Minecraft_blocks" `
            --add-data "Panoramas;Panoramas" `
            --add-data "icon.png;." `
            main.py
      - name: Zip exe
        run: Compress-Archive -Path "dist/MinecraftLauncher/*" -DestinationPath "dist/MinecraftLauncher-win.zip"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MinecraftLauncher-win.zip
